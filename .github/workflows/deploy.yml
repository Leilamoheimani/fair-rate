name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
        env:
          VITE_APP_VERSION: ${{ github.sha }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: frontend/dist

  test-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run test:rules

  deploy-pages:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [build, test-rules]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  deploy-firebase:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [test-rules]
    runs-on: ubuntu-latest
    env:
      HAS_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' }}
    steps:
      - if: env.HAS_SERVICE_ACCOUNT != 'true'
        run: echo "::warning::FIREBASE_SERVICE_ACCOUNT secret is not set, skipping Firestore rules deploy."
      - if: env.HAS_SERVICE_ACCOUNT == 'true'
        uses: actions/checkout@v7
      - if: env.HAS_SERVICE_ACCOUNT == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - if: env.HAS_SERVICE_ACCOUNT == 'true'
        run: npm ci
      - if: env.HAS_SERVICE_ACCOUNT == 'true'
        name: Deploy Firestore rules and indexes
        run: |
          echo "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/service-account.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/service-account.json"
          npx firebase deploy --only firestore:rules,firestore:indexes --non-interactive
          rm -f "$RUNNER_TEMP/service-account.json"
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
